@keyframes m-star{0%,100%{transform:scale(.55) rotate(0deg);opacity:.35}50%{transform:scale(1) rotate(12deg);opacity:1}}
@keyframes m-dot{0%,100%{opacity:.25}50%{opacity:1}}
