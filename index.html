<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <!-- 網頁分頁圖示、iOS 加到主畫面圖示、PWA manifest：都用 DiuLa! logo（Logo2.png 縮出來的）。
         %BASE_URL% 由 Vite 換成 '/'（dev）或 '/diula-outter/'（GitHub Pages）。 -->
    <link rel="icon" type="image/png" href="%BASE_URL%favicon.png" />
    <link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon.png" />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- iOS Safari 遇到字小於 16px 的輸入框會自動放大，鍵盤收起後也不縮回。
         只在 iPhone／iPad 加 maximum-scale=1 擋掉自動放大（iOS 10 起仍可兩指手動縮放）；
         Android 會因 maximum-scale 失去兩指縮放，所以不加。iPadOS 的 UA 偽裝成 Mac，用觸控點數判斷。 -->
    <script>
      if (/iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1)) {
        document.querySelector('meta[name="viewport"]').content += ', maximum-scale=1'
      }
    </script>
    <title>DiuLa! 遺失物協尋</title>
    <!-- design.md §3：英數字用 Comfortaa（中文用自架的 GenSenRounded2 TW，見 src/fonts.css）。
         Chiron GoRound TC 是源泉圓體下載完成前／罕見字的圓體備援：Google Fonts 依 unicode-range 切片，很快就能顯示。 -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;500;600;700&family=Chiron+GoRound+TC:wght@400;500;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
